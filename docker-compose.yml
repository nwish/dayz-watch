services:
  dayz-watch:
    build: .
    container_name: dayz-watch
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Default webhook for servers added without their own. Optional.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Enables HTTP basic auth on the web UI (any username). Strongly recommended.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      POLL_SECONDS: ${POLL_SECONDS:-30}
    volumes:
      - dayz-watch-data:/data

volumes:
  dayz-watch-data:
