services:
  dayz-watch:
    build: .
    container_name: dayz-watch
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Default webhook for servers added without their own. Optional.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # First-run admin account, used only while no users exist. If ADMIN_PASSWORD is empty a random
      # one is generated and printed once in the container log (`docker logs dayz-watch`).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Set both when behind an HTTPS reverse proxy (see README).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POLL_SECONDS: ${POLL_SECONDS:-30}
    volumes:
      - dayz-watch-data:/data

volumes:
  dayz-watch-data:
