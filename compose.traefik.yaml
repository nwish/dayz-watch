# Optional overlay for hosts that sit behind Traefik. Use it together with compose.yaml:
#   docker compose -f compose.yaml -f compose.traefik.yaml up -d --build
# The hostname and middleware names come from `.env` (never committed).
services:
  dayz-watcher:
    environment:
      TRUST_PROXY: "true" # client IP for login rate limiting comes from Traefik's X-Forwarded-For
    labels:
      - traefik.enable=true
      - traefik.http.routers.dayzwatch.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.dayzwatch.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dayzwatch.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.dayzwatch.middlewares=${TRAEFIK_MIDDLEWARES:-}
