<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dayz-watch</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px system-ui, sans-serif; background: #14161a; color: #e6e6e6; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #2a2d33; }
  th { color: #9aa0a6; font-weight: 500; }
  .err { color: #ff7b72; }
  .ok { color: #7ee787; }
  .muted { color: #9aa0a6; }
  form { display: grid; grid-template-columns: 2fr 1fr; gap: .6rem; }
  form input[name=webhookUrl] { grid-column: 1 / -1; }
  input, button { font: inherit; padding: .5rem .6rem; background: #1e2127; color: inherit; border: 1px solid #333840; border-radius: 4px; }
  button { cursor: pointer; }
  button:hover { border-color: #5865f2; }
  #msg { grid-column: 1 / -1; min-height: 1.2em; }
  #warn { color: #f0b429; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #1b1e24; }
  #overlay { --art: #1a1d23; --border: #333840; --text: #e6e6e6; --muted: #9aa0a6; --accent: #c9d1d9; --backdrop: rgba(0,0,0,.78); --btn-bg: #1e2127; --ok: #7ee787; --err: #ff7b72; position: fixed; inset: 0; background: var(--backdrop); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay[hidden] { display: none; }
  .card { position: relative; width: min(680px, 92vw); max-height: 92vh; overflow: auto; background: var(--art); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 2rem 2.2rem; }
  .card h2 { margin: 0 2rem .5rem 0; font-size: 1.15rem; font-weight: 600; color: var(--accent); }
  .close { position: absolute; top: .8rem; right: .8rem; width: 2.2rem; height: 2.2rem; padding: 0; font-size: 1.4rem; line-height: 1; }
  #ov-count { font-weight: 700; line-height: 1; margin: .4rem 0; display: inline-block; }
  #ov-players { font-size: 8rem; }
  #ov-max { font-size: 2.6rem; color: var(--muted); margin-left: .6rem; }
  .delta { font-size: 1.4rem; font-weight: 600; min-height: 1.8rem; margin-bottom: 1rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.4rem; margin: 0 0 1.2rem; }
  dt { color: var(--muted); }
  .card .muted { color: var(--muted); }
  .card button { background: var(--btn-bg); color: var(--text); border-color: var(--border); }
  .card .ok { color: var(--ok); }
  .card .err { color: var(--err); }
  dd { margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .card { isolation: isolate; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--flash, transparent); opacity: 0; pointer-events: none; z-index: 0; }
  .card > :not(.close) { position: relative; z-index: 1; }
  .flash-up { --flash: #2ea043; animation: flash-up .5s ease-in-out 5; }
  .flash-down { --flash: #da3633; animation: flash-down .5s ease-in-out 5; }
  .flash-up::before, .flash-down::before { animation: flash-fill .5s ease-in-out 5; }
  #ov-count.pop { animation: pop .6s ease-out; }
  @keyframes flash-fill { 50% { opacity: .55; } }
  @keyframes flash-up {
    50% { border-color: #3fb950; box-shadow: 0 0 0 10px rgba(63,185,80,.55), 0 0 90px 20px rgba(63,185,80,.7); }
  }
  @keyframes flash-down {
    50% { border-color: #f85149; box-shadow: 0 0 0 10px rgba(248,81,73,.55), 0 0 90px 20px rgba(248,81,73,.7); }
  }
  @keyframes pop { 30% { transform: scale(1.25); } }
</style>
</head>
<body>
<h1>dayz-watch</h1>
<p id="warn"></p>
<table>
  <thead><tr><th>Server</th><th>Address</th><th>Map</th><th>Players</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
</table>

<h2 style="font-size:1.05rem">Add server</h2>
<form id="add">
  <input name="host" placeholder="Host or IP, e.g. 85.190.157.254" required>
  <input name="queryPort" type="number" min="1" max="65535" placeholder="Query port (game port + 1)" required>
  <input name="webhookUrl" id="webhook" placeholder="Discord webhook URL (optional; blank = monitor only unless a default is set)" autocomplete="off">
  <button type="submit">Add</button>
  <span id="msg"></span>
</form>

<div id="overlay" hidden>
  <div id="card" class="card" role="dialog" aria-modal="true" aria-labelledby="ov-name">
    <button id="ov-close" class="close" aria-label="Close">×</button>
    <h2 id="ov-name"></h2>
    <div id="ov-count"><span id="ov-players">—</span><span id="ov-max"></span></div>
    <div id="ov-delta" class="delta"></div>
    <dl id="ov-info"></dl>
    <div class="foot"><span id="ov-status" class="muted"></span><button id="ov-mute">Sound: on</button></div>
  </div>
</div>

<script>
const rows = document.getElementById("rows");
const msg = document.getElementById("msg");
let openId = null;
let lastPlayers = null;
let muted = false;
let audioCtx = null;

function cell(tr, text, cls) {
  const td = tr.insertCell();
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
}

async function load() {
  const r = await fetch("/api/servers");
  const data = await r.json();
  rows.replaceChildren();
  if (!data.servers.length) {
    const tr = rows.insertRow();
    const td = cell(tr, "No servers yet.", "muted");
    td.colSpan = 6;
  }
  for (const s of data.servers) {
    const tr = rows.insertRow();
    tr.className = "clickable";
    tr.onclick = () => openOverlay(s);
    cell(tr, s.info?.name ?? "—");
    cell(tr, `${s.host}:${s.queryPort}`);
    cell(tr, s.info?.map ?? "—");
    cell(tr, s.info ? `${s.info.players}/${s.info.maxPlayers}` : "—");
    const notifies = s.hasWebhook || data.defaultWebhook;
    cell(tr, (s.error ? s.error : `ok, ${ago(s.checkedAt)}`) + (notifies ? "" : " · no webhook, not notifying"), s.error ? "err" : notifies ? "ok" : "muted");
    const td = tr.insertCell();
    const btn = document.createElement("button");
    btn.textContent = "Remove";
    btn.onclick = async (ev) => {
      ev.stopPropagation(); // don't open the overlay
      if (!confirm(`Remove ${s.host}:${s.queryPort}?`)) return;
      await fetch(`/api/servers/${s.id}`, { method: "DELETE" });
      load();
    };
    td.append(btn);
  }
  refreshOverlay(data.servers);
}

// ---- Server detail overlay ----
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const ovCount = document.getElementById("ov-count");

// ---- Per-map themes, each with a day and a night variant ----
// Keyed by the A2S map name (lower-cased, letters only). Day/night follows the server's in-game clock.
// Art is inline SVG layered on the card: a sun/moon/cloud accent, stars at night, and a landscape along the bottom.
const svgUrl = (vb, body, aspect = "none") =>
  `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}' preserveAspectRatio='${aspect}'>${body}</svg>`)}")`;
const ridge = (d, fill, op) => `<path d='${d} L600 200 L0 200Z' fill='${fill}' opacity='${op}'/>`;
const pines = (fill, op, base, h) =>
  Array.from({ length: 24 }, (_, k) => {
    const x = k * 26 + (k % 3) * 7;
    const s = 0.75 + ((k * 7) % 5) * 0.14;
    return `<g fill='${fill}' opacity='${op}'><polygon points='${x - 15 * s},${base} ${x},${base - h * s} ${x + 15 * s},${base}'/><polygon points='${x - 11 * s},${base - h * s * 0.4} ${x},${base - h * s * 1.2} ${x + 11 * s},${base - h * s * 0.4}'/></g>`;
  }).join("");
const waves = (y, fill, op) => ridge(`M0 ${y} Q50 ${y - 20} 100 ${y} T200 ${y} T300 ${y} T400 ${y} T500 ${y} T600 ${y}`, fill, op);
const disc = (cx, cy, r, fill, op) => `<circle cx='${cx}' cy='${cy}' r='${r}' fill='${fill}' opacity='${op}'/>`;
const sun = (core) => svgUrl("0 0 140 140", disc(70, 70, 56, core, 0.2) + disc(70, 70, 34, core, 0.95), "xMidYMid meet");
const moon = (core) =>
  svgUrl("0 0 140 140", `<mask id='m'><rect width='140' height='140' fill='white'/><circle cx='88' cy='58' r='30' fill='black'/></mask>${disc(70, 70, 54, core, 0.12)}<circle cx='66' cy='74' r='34' fill='${core}' mask='url(#m)'/>`, "xMidYMid meet");
const clouds = (fill, op) => svgUrl("0 0 140 140", `<ellipse cx='55' cy='72' rx='42' ry='16' fill='${fill}' opacity='${op}'/><ellipse cx='88' cy='58' rx='34' ry='15' fill='${fill}' opacity='${op}'/>`, "xMidYMid meet");
const flakes = svgUrl("0 0 140 140", [[30, 40, 5], [90, 25, 4], [110, 80, 6], [55, 100, 4], [20, 115, 3], [75, 60, 3]].map(([x, y, r]) => disc(x, y, r, "#ffffff", 0.7)).join(""), "xMidYMid meet");
const aurora = svgUrl("0 0 600 120", "<defs><filter id='b'><feGaussianBlur stdDeviation='9'/></filter></defs><path d='M0 70 C100 10 200 100 300 50 S500 20 600 60' stroke='#5ff2b0' stroke-width='24' fill='none' opacity='.45' filter='url(#b)'/><path d='M0 95 C120 45 220 120 330 78 S520 50 600 90' stroke='#9a7bff' stroke-width='16' fill='none' opacity='.35' filter='url(#b)'/>");
const starsUrl = svgUrl("0 0 600 200", Array.from({ length: 34 }, (_, k) => disc((k * 97 + 31) % 600, (k * 53 + 17) % 190, 0.9 + (k % 3) * 0.5, "#ffffff", 0.35 + (k % 4) * 0.18)).join(""));

const TOP_RIGHT = "right 60px top 16px / 130px 130px no-repeat";
const BOTTOM = "bottom / 100% 34% no-repeat";
const STARS = [starsUrl, "top / 100% 55% no-repeat"];
const accent = (url) => [url, TOP_RIGHT];
const land = (body) => [svgUrl("0 0 600 200", body), BOTTOM];
const grad = (a, b) => `linear-gradient(180deg,${a} 0%,${b} 100%)`;

// Button/ok/err colours differ between light (day) and dark (night) cards.
const night = (v) => ({ btnBg: "rgba(0,0,0,.35)", ok: "#7ee787", err: "#ff7b72", ...v });
const day = (v) => ({ btnBg: "rgba(255,255,255,.6)", ok: "#1a7f37", err: "#c62828", ...v });

const THEMES = {
  default: {
    night: night({ sky: "#1a1d23", border: "#333840", text: "#e6e6e6", muted: "#9aa0a6", accent: "#c9d1d9", backdrop: "rgba(0,0,0,.78)", btnBg: "#1e2127", layers: [] }),
    day: day({ sky: grad("#eef2f7", "#d5dde8"), border: "#9aa7b8", text: "#1d232b", muted: "#556070", accent: "#2b3a52", backdrop: "rgba(30,40,55,.7)", layers: [] }),
  },
  desert: {
    night: night({
      sky: grad("#140d08", "#3a2412"), border: "#d9964a", text: "#fbeed7", muted: "#cfae82", accent: "#ffc977", backdrop: "rgba(40,20,5,.86)",
      layers: [accent(moon("#f4e8c0")), STARS, land(ridge("M0 120 C100 60 200 140 320 90 C430 45 520 110 600 80", "#d9964a", 0.3) + ridge("M0 165 C120 120 240 195 360 140 C470 100 540 150 600 130", "#b9722f", 0.45))],
    }),
    day: day({
      sky: grad("#6ab7e6", "#f3d9a2"), border: "#b8742c", text: "#3a2410", muted: "#5a3a1c", accent: "#8a4a10", backdrop: "rgba(70,45,10,.72)",
      layers: [accent(sun("#ffd23f")), land(ridge("M0 120 C100 60 200 140 320 90 C430 45 520 110 600 80", "#f6d391", 0.85) + ridge("M0 165 C120 120 240 195 360 140 C470 100 540 150 600 130", "#e8b064", 0.92))],
    }),
  },
  forest: {
    night: night({
      sky: grad("#0b1f14", "#1d4029"), border: "#4c9a63", text: "#e9f5ec", muted: "#9cc2a6", accent: "#8fe0a3", backdrop: "rgba(2,12,6,.88)",
      layers: [accent(moon("#e8f5d0")), STARS, land(pines("#3f9a5c", 0.5, 200, 95) + pines("#143d25", 0.8, 215, 80))],
    }),
    day: day({
      sky: grad("#8fd0e8", "#d4ecc0"), border: "#2f7a47", text: "#12301c", muted: "#1f4a2c", accent: "#1f6b3a", backdrop: "rgba(10,40,20,.7)",
      layers: [accent(sun("#fff3a0")), land(pines("#7cc08a", 0.9, 200, 95) + pines("#58a870", 0.95, 215, 80))],
    }),
  },
  temperate: {
    night: night({
      sky: grad("#101418", "#223024"), border: "#8a9a5b", text: "#eceee4", muted: "#aab39a", accent: "#c5d27a", backdrop: "rgba(6,8,6,.86)",
      layers: [accent(moon("#e6e9d6")), STARS, land(ridge("M0 110 C90 70 180 120 300 85 C420 50 500 100 600 75", "#8a9a5b", 0.28) + ridge("M0 160 C130 115 230 175 350 130 C460 90 540 140 600 120", "#4f6b3a", 0.5))],
    }),
    day: day({
      sky: grad("#9cc4e8", "#dbe7c6"), border: "#6a8a3a", text: "#1f2a1a", muted: "#34462a", accent: "#3f6a14", backdrop: "rgba(25,35,20,.7)",
      layers: [accent(clouds("#ffffff", 0.85)), land(ridge("M0 110 C90 70 180 120 300 85 C420 50 500 100 600 75", "#b9d088", 0.9) + ridge("M0 160 C130 115 230 175 350 130 C460 90 540 140 600 120", "#93bb62", 0.95))],
    }),
  },
  arctic: {
    night: night({
      sky: grad("#0c1824", "#1e3a52"), border: "#8cc4ee", text: "#eef7ff", muted: "#a2c3dc", accent: "#b6e2ff", backdrop: "rgba(2,10,20,.88)",
      layers: [accent(flakes), STARS, land(ridge("M0 130 L60 90 L100 125 L170 60 L230 120 L300 80 L360 130 L440 55 L510 115 L560 90 L600 120", "#cfeaff", 0.22) + ridge("M0 170 L80 135 L150 165 L250 120 L340 160 L450 125 L540 160 L600 140", "#8fc7ee", 0.32))],
    }),
    day: day({
      sky: grad("#bfe3ff", "#eef8ff"), border: "#6fb0e0", text: "#0c2a40", muted: "#2a5278", accent: "#0b5a96", backdrop: "rgba(15,35,55,.68)",
      layers: [accent(sun("#fffbe0")), land(ridge("M0 130 L60 90 L100 125 L170 60 L230 120 L300 80 L360 130 L440 55 L510 115 L560 90 L600 120", "#ffffff", 0.9) + ridge("M0 170 L80 135 L150 165 L250 120 L340 160 L450 125 L540 160 L600 140", "#c3e0f5", 0.95))],
    }),
  },
  sakhal: {
    night: night({
      sky: grad("#0f1428", "#233a5a"), border: "#6fe3c1", text: "#eef6ff", muted: "#9eb4d0", accent: "#7ff0cf", backdrop: "rgba(4,6,18,.9)",
      layers: [[aurora, "top / 100% 38% no-repeat"], STARS, land(ridge("M0 140 L70 100 L140 135 L220 75 L300 130 L400 90 L500 135 L600 105", "#dbe8ff", 0.2) + ridge("M0 175 L90 145 L190 172 L300 140 L420 172 L520 150 L600 168", "#7aa2d6", 0.34))],
    }),
    day: day({
      sky: grad("#9fb4d4", "#e1e9f4"), border: "#6a88b8", text: "#14213a", muted: "#34476a", accent: "#1f4f9a", backdrop: "rgba(15,25,45,.7)",
      layers: [accent(clouds("#ffffff", 0.8)), land(ridge("M0 140 L70 100 L140 135 L220 75 L300 130 L400 90 L500 135 L600 105", "#ffffff", 0.9) + ridge("M0 175 L90 145 L190 172 L300 140 L420 172 L520 150 L600 168", "#bccbe4", 0.95))],
    }),
  },
  coast: {
    night: night({
      sky: grad("#0b1e2b", "#14505a"), border: "#4fc3b5", text: "#e6f7f5", muted: "#96c4c0", accent: "#6fe0d0", backdrop: "rgba(2,12,18,.88)",
      layers: [accent(moon("#fff2c9")), STARS, land(waves(120, "#4fc3b5", 0.28) + waves(155, "#1f8f94", 0.4) + waves(185, "#0d5e6a", 0.55))],
    }),
    day: day({
      sky: grad("#7fd0f0", "#c4ecf2"), border: "#2f9aa8", text: "#06303a", muted: "#0f4550", accent: "#05707f", backdrop: "rgba(5,40,50,.68)",
      layers: [accent(sun("#fff3b0")), land(waves(120, "#8adbe6", 0.85) + waves(155, "#5fc0cf", 0.9) + waves(185, "#3aa5b4", 0.95))],
    }),
  },
  harvest: {
    night: night({
      sky: grad("#14110a", "#4a3d17"), border: "#d6b34a", text: "#f8f0d4", muted: "#c9b87c", accent: "#f0cf63", backdrop: "rgba(20,14,2,.88)",
      layers: [accent(moon("#f5e7b0")), STARS, land(ridge("M0 115 C110 80 210 130 330 95 C440 62 520 105 600 85", "#d6b34a", 0.28) + ridge("M0 165 C130 130 240 185 360 145 C470 110 540 150 600 135", "#8c7a2c", 0.5))],
    }),
    day: day({
      sky: grad("#8fcfee", "#f6e6a8"), border: "#c9a030", text: "#3a2c08", muted: "#5e4a10", accent: "#8a5a00", backdrop: "rgba(55,40,5,.7)",
      layers: [accent(sun("#ffe066")), land(ridge("M0 115 C110 80 210 130 330 95 C440 62 520 105 600 85", "#f6df8a", 0.9) + ridge("M0 165 C130 130 240 185 360 145 C470 110 540 150 600 135", "#e6c050", 0.95))],
    }),
  },
};
const MAP_THEME = {
  nasdara: "desert", takistan: "desert", takistanplus: "desert",
  enoch: "forest", livonia: "forest",
  chernarus: "temperate", chernarusplus: "temperate",
  namalsk: "arctic",
  sakhal: "sakhal",
  deerisle: "coast",
  esseker: "harvest",
};

function themeKey(map) {
  const m = (map ?? "").toLowerCase().replace(/[^a-z]/g, "");
  return MAP_THEME[m] ?? (m.startsWith("chernarus") ? "temperate" : "default");
}

// In-game clock "HH:MM" -> day from 06:00 to 17:59, otherwise night. No clock reported: assume day.
function phaseOf(gameTime) {
  const h = Number(/^(\d{2}):/.exec(gameTime ?? "")?.[1]);
  return Number.isNaN(h) || (h >= 6 && h < 18) ? "day" : "night";
}

function applyTheme(map, gameTime) {
  const key = themeKey(map);
  const phase = phaseOf(gameTime);
  const id = `${key}-${phase}`;
  if (card.dataset.theme === id) return;
  const t = THEMES[key][phase];
  card.dataset.theme = id;
  const set = (k, v) => overlay.style.setProperty(k, v);
  set("--art", [...t.layers.map((l) => l.join(" ")), t.sky].join(", "));
  set("--border", t.border);
  set("--text", t.text);
  set("--muted", t.muted);
  set("--accent", t.accent);
  set("--backdrop", t.backdrop);
  set("--btn-bg", t.btnBg);
  set("--ok", t.ok);
  set("--err", t.err);
}

function openOverlay(s) {
  // Created inside the click handler so the browser allows audio playback later.
  audioCtx ??= new AudioContext();
  audioCtx.resume();
  openId = s.id;
  lastPlayers = s.info?.players ?? null;
  document.getElementById("ov-delta").textContent = "";
  applyTheme(s.info?.map, s.info?.gameTime);
  card.classList.remove("flash-up", "flash-down");
  overlay.hidden = false;
  renderOverlay(s);
}

function closeOverlay() {
  openId = null;
  overlay.hidden = true;
}

function renderOverlay(s) {
  const i = s.info;
  if (i) applyTheme(i.map, i.gameTime);
  document.getElementById("ov-name").textContent = i?.name ?? `${s.host}:${s.queryPort}`;
  document.getElementById("ov-players").textContent = i ? i.players : "—";
  document.getElementById("ov-max").textContent = i ? `/ ${i.maxPlayers}` : "";
  const yn = (v) => (v ? "Yes" : "No");
  const facts = [
    ["Address", `${s.host}:${s.queryPort}`],
    ["Game port", i?.gamePort ?? "—"],
    ["Map", i?.map ?? "—"],
    ["Version", i?.version ?? "—"],
    ["Platform", i?.platform ?? "—"],
    ["In-game time", i?.gameTime ?? "—"],
    ["BattlEye", i ? yn(i.battleye) : "—"],
    ["Third person", i ? yn(i.thirdPerson) : "—"],
    ["Password", i ? yn(i.passwordProtected) : "—"],
  ];
  const dl = document.getElementById("ov-info");
  dl.replaceChildren();
  for (const [k, v] of facts) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    dl.append(dt, dd);
  }
  const st = document.getElementById("ov-status");
  st.textContent = s.error ? s.error : `Last checked ${ago(s.checkedAt)}`;
  st.className = s.error ? "err" : "muted";
}

function refreshOverlay(servers) {
  if (!openId) return;
  const s = servers.find((x) => x.id === openId);
  if (!s) return closeOverlay(); // removed elsewhere
  renderOverlay(s);
  if (!s.info) return;
  if (lastPlayers !== null && s.info.players !== lastPlayers) alertChange(s.info.players - lastPlayers);
  lastPlayers = s.info.players;
}

function alertChange(delta) {
  const up = delta > 0;
  const n = Math.abs(delta);
  const el = document.getElementById("ov-delta");
  el.textContent = `${up ? "+" : "−"}${n} ${up ? "joined" : "left"} at ${new Date().toLocaleTimeString()}`;
  el.className = `delta ${up ? "ok" : "err"}`;
  // Restart the CSS animations even if a previous flash is still running.
  card.classList.remove("flash-up", "flash-down");
  ovCount.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add(up ? "flash-up" : "flash-down");
  ovCount.classList.add("pop");
  beep(up);
}

function beep(up) {
  if (muted || !audioCtx) return;
  // Rising two-tone for a join, falling for a leave; three repeats so it's hard to miss.
  const [a, b] = up ? [660, 990] : [880, 440];
  const t0 = audioCtx.currentTime;
  for (let k = 0; k < 3; k++) {
    [a, b].forEach((freq, j) => {
      const t = t0 + k * 0.5 + j * 0.2;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    });
  }
}

document.getElementById("ov-close").onclick = closeOverlay;
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeOverlay();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) closeOverlay();
});
document.getElementById("ov-mute").onclick = (e) => {
  muted = !muted;
  e.target.textContent = muted ? "Sound: off" : "Sound: on";
  if (!muted) beep(true); // audible confirmation
};

document.getElementById("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = { host: f.host.value, queryPort: f.queryPort.value, webhookUrl: f.webhookUrl.value };
  const r = await fetch("/api/servers", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  msg.textContent = r.ok ? "Added." : data.error;
  msg.className = r.ok ? "ok" : "err";
  if (r.ok) f.reset();
  load();
});

load();
setInterval(load, 3000);
</script>
