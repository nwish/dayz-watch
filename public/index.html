<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dayz-watch</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Page-specific styles. The palette, header, form controls, tables and text colours come from /theme.css. */
  body { --ctl-pad: .5rem .6rem; max-width: 900px; }
  table { margin-bottom: 1.5rem; }
  th { font-size: .8rem; }
  .toolbar { display: flex; align-items: center; gap: .8rem; margin-bottom: .8rem; }
  .toolbar > button { margin: 0; flex: none; }
  #monbar { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: .15rem 1rem; padding: .45rem .7rem; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--dim); border-radius: 3px; font-size: .82rem; color: var(--dim); }
  #monbar[data-tone=ok] { border-left-color: var(--ok); }
  #monbar[data-tone=warn] { border-left-color: var(--warn); }
  #monbar[data-tone=err] { border-left-color: var(--err); }
  #monbar .head { font-weight: 600; color: var(--fg); }
  #monbar .ok { color: var(--ok); }
  #monbar .warn { color: var(--warn); }
  #monbar .err { color: var(--err); }
  /* The add-server modal. overflow: visible lets the directory dropdown extend past the dialog's edge. */
  #add-dialog { width: min(560px, calc(100% - 1.5rem)); box-sizing: border-box; padding: 0; overflow: visible; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  #add-dialog::backdrop { background: rgba(0,0,0,.7); }
  #add-dialog .dlg-body { position: relative; padding: 1.4rem 1.5rem; }
  #add-dialog h2 { margin: 0 2.5rem 1rem 0; font-size: 1.1rem; }
  #add { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  #add input[name=webhookUrl] { grid-column: 1 / -1; }
  .combo { grid-column: 1 / -1; position: relative; }
  .combo input { width: 100%; box-sizing: border-box; }
  #dir-list { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 0; list-style: none; max-height: 22rem; overflow-y: auto; background: var(--field); border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 8px 24px #000a; }
  #dir-list[hidden] { display: none; }
  #dir-list li { padding: .45rem .6rem; cursor: pointer; border-bottom: 1px solid var(--line); }
  #dir-list li:last-child { border-bottom: 0; }
  #dir-list li[aria-selected=true], #dir-list li:hover { background: var(--raise); box-shadow: inset 3px 0 var(--hl); }
  #dir-list li.note { cursor: default; color: var(--dim); }
  #dir-list li.note:hover { background: none; box-shadow: none; }
  #dir-list .dn { overflow-wrap: anywhere; }
  #dir-list .dm { font-size: .85em; color: var(--dim); }
  header { margin-bottom: 1rem; }
  section { margin-top: 2rem; }
  section h2 { font-size: 1.05rem; }
  .row-actions { display: flex; flex-wrap: nowrap; align-items: stretch; justify-content: flex-end; gap: .4rem; white-space: nowrap; }
  .row-actions > * { margin: 0; }
  .status-pill { position: relative; display: inline-flex; align-items: center; padding: .28rem .55rem; border: 1px solid currentColor; border-radius: 999px; background: var(--field); color: var(--dim); font-size: .78rem; font-weight: 600; line-height: 1; cursor: pointer; }
  .status-pill.online { background: rgba(163,196,106,.1); color: var(--ok); }
  .status-pill.online::before { width: .4rem; height: .4rem; margin-right: .35rem; border-radius: 50%; background: currentColor; content: ""; }
  .status-pill.online.polled { animation: status-heartbeat 1.1s ease-out; }
  .status-pill.online.polled::before { animation: status-heartbeat-dot 1.1s ease-out; }
  .status-pill.warning, .status-pill.restarting { color: var(--warn); }
  .status-pill.offline { color: var(--err); }
  .status-pill.checking { background: rgba(163,184,108,.12); color: var(--hl); animation: status-pulse 1s ease-in-out infinite; }
  .status-pill.checking::before { width: .45rem; height: .45rem; margin-right: .35rem; border-radius: 50%; background: currentColor; content: ""; animation: status-dot 1s ease-in-out infinite; }
  .status-pill::after { content: attr(data-detail); position: absolute; z-index: 5; top: calc(100% + .45rem); left: 0; width: max-content; max-width: min(22rem, calc(100vw - 3rem)); padding: .45rem .55rem; border: 1px solid var(--hl); border-radius: 3px; background: var(--field); color: var(--fg); box-shadow: 0 6px 18px #000a; font: .8rem/1.35 system-ui; letter-spacing: normal; text-align: left; text-transform: none; white-space: normal; opacity: 0; pointer-events: none; transform: translateY(-.2rem); visibility: hidden; transition: opacity .15s ease, transform .15s ease, visibility .15s; }
  .status-pill:hover::after, .status-pill:focus-visible::after, .status-pill.expanded::after { opacity: 1; transform: none; visibility: visible; }
  @keyframes status-pulse { 50% { background: rgba(163,184,108,.28); box-shadow: 0 0 0 .45rem rgba(163,184,108,.38); } }
  @keyframes status-dot { 50% { opacity: .35; transform: scale(.6); } }
  @keyframes status-heartbeat { 30% { background: rgba(163,196,106,.28); box-shadow: 0 0 0 .4rem rgba(163,196,106,.38); } 100% { box-shadow: none; } }
  @keyframes status-heartbeat-dot { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .status-pill.checking, .status-pill.checking::before, .status-pill.online.polled, .status-pill.online.polled::before { animation: none; } }
  #msg { grid-column: 1 / -1; min-height: 1.2em; }
  #warn { color: var(--warn); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--panel); box-shadow: inset 3px 0 var(--hl); }
  #overlay { --art: #1a1d23; --border: #333840; --text: #e6e6e6; --muted: #9aa0a6; --accent: #c9d1d9; --backdrop: rgba(0,0,0,.78); --btn-bg: #1e2127; --ok: #7ee787; --err: #ff7b72; position: fixed; inset: 0; background: var(--backdrop); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay[hidden] { display: none; }
  /* While the detail card is open the page behind it must not scroll; the gutter stays reserved so the layout doesn't jump. */
  html { scrollbar-gutter: stable; }
  html.modal-open { overflow: hidden; }
  #overlay { overscroll-behavior: contain; }
  .card { position: relative; width: min(680px, 92vw); max-height: 92vh; overflow: auto; background: var(--art); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 2rem 2.2rem; }
  .card h2 { margin: 0 2rem .5rem 0; font-size: 1.15rem; font-weight: 600; color: var(--accent); font-family: inherit; text-transform: none; letter-spacing: normal; } /* the server name, not a page heading */
  .close { position: absolute; top: .8rem; right: .8rem; width: 2.2rem; height: 2.2rem; padding: 0; font-size: 1.4rem; line-height: 1; }
  #ov-count { font-weight: 700; line-height: 1; margin: .4rem 0; display: inline-block; }
  #ov-players { font-size: 8rem; }
  #ov-max { font-size: 2.6rem; color: var(--muted); margin-left: .6rem; }
  .card.offline #ov-count { opacity: .5; filter: grayscale(1); }
  .card.offline #ov-players { font-size: 4.5rem; text-transform: uppercase; letter-spacing: .06em; }
  .card.restarting #ov-players { font-size: 3.2rem; }
  .delta { font-size: 1.4rem; font-weight: 600; min-height: 1.8rem; margin-bottom: 1rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.4rem; margin: 0 0 1.2rem; }
  dt { color: var(--muted); }
  .card .muted { color: var(--muted); }
  .card button { background: var(--btn-bg); color: var(--text); border-color: var(--border); }
  .card .ok { color: var(--ok); }
  .card .err { color: var(--err); }
  dd { margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .foot-btns { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
  .card { isolation: isolate; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--flash, transparent); opacity: 0; pointer-events: none; z-index: 0; }
  .card > :not(.close) { position: relative; z-index: 1; }
  .flash-up { --flash: #2ea043; animation: flash-up .5s ease-in-out 5; }
  .flash-down { --flash: #da3633; animation: flash-down .5s ease-in-out 5; }
  .flash-up::before, .flash-down::before { animation: flash-fill .5s ease-in-out 5; }
  #ov-count.pop { animation: pop .6s ease-out; }
  @keyframes flash-fill { 50% { opacity: .55; } }
  @keyframes flash-up {
    50% { border-color: #3fb950; box-shadow: 0 0 0 10px rgba(63,185,80,.55), 0 0 90px 20px rgba(63,185,80,.7); }
  }
  @keyframes flash-down {
    50% { border-color: #f85149; box-shadow: 0 0 0 10px rgba(248,81,73,.55), 0 0 90px 20px rgba(248,81,73,.7); }
  }
  @keyframes pop { 30% { transform: scale(1.25); } }
  @media (max-width: 640px) {
    .toolbar { flex-wrap: wrap; }
    #monbar { flex-basis: 100%; order: 2; }
    .toolbar > button { margin-left: auto; }
    button, input, select, a.btn { padding: .65rem .75rem; }
    button, a.btn { white-space: nowrap; }
    header { flex-wrap: wrap; gap: .2rem .8rem; }
    h1 { margin: .3rem 0; white-space: nowrap; }
    nav { flex-wrap: wrap; gap: .5rem; }
    nav #who { flex-basis: 100%; }
    /* tables become stacked cards instead of scrolling sideways */
    thead { display: none; }
    table, tbody { display: block; }
    #rows tr.clickable { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name name" "addr players" "map act" "status status"; gap: .25rem .8rem; padding: .8rem .2rem; border-bottom: 1px solid var(--line); align-items: center; }
    #rows tr.clickable td { border: 0; padding: 0; }
    #rows td:nth-child(1) { grid-area: name; font-weight: 600; overflow-wrap: anywhere; }
    #rows td:nth-child(2) { grid-area: addr; color: var(--dim); overflow-wrap: anywhere; }
    #rows td:nth-child(3) { grid-area: map; color: var(--dim); }
    #rows td:nth-child(4) { grid-area: players; justify-self: end; font-weight: 700; font-size: 1.25rem; }
    #rows td:nth-child(5) { grid-area: status; font-size: .85em; }
    #rows td:nth-child(6) { grid-area: act; justify-self: end; }
    #rows td button { margin: 0; }
    /* forms stack one field per row */
    #add { grid-template-columns: 1fr; }
    .inline > * { flex: 1 1 100%; }
    /* overlay */
    .card { background: var(--art-sm, var(--art)); box-sizing: border-box; width: calc(100% - 1.5rem); padding: 1.2rem 1.1rem; } /* border-box + calc: .75rem of backdrop on each side */
    #ov-players { font-size: 5.5rem; }
    .card.offline #ov-players { font-size: 3.2rem; }
    .card.restarting #ov-players { font-size: 2.2rem; }
    #ov-max { font-size: 1.8rem; }
    .delta { font-size: 1.15rem; }
    dl { gap: .35rem 1rem; }
    .foot { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="/favicon.svg" alt="">dayz-watch</h1>
  <nav>
    <span id="who" class="muted"></span>
    <a class="btn" id="admin-link" href="/admin" hidden>Admin</a>
    <a class="btn" id="acct-btn" href="/account" hidden>Account</a>
    <button id="logout">Log out</button>
  </nav>
</header>
<div class="toolbar">
  <div id="monbar" role="status" aria-live="off"><span class="head">Loading…</span></div>
  <button id="add-open" type="button">+ Add server</button>
</div>
<table>
  <thead><tr><th>Server</th><th>Address</th><th>Map</th><th>Players</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
</table>

<dialog id="add-dialog" aria-labelledby="add-title">
  <div class="dlg-body">
    <button id="add-close" type="button" class="close" aria-label="Close">×</button>
    <h2 id="add-title">Add server</h2>
    <form id="add">
      <div class="combo">
        <input id="dir-q" type="search" placeholder="Search public servers by name, map, number or IP (or fill in the fields below)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="dir-list" aria-autocomplete="list">
        <ul id="dir-list" role="listbox" hidden></ul>
      </div>
      <input name="host" placeholder="Host or IP, e.g. 85.190.157.254" required>
      <input name="queryPort" type="number" min="1" max="65535" placeholder="Query port (game port + 1)" required>
      <input name="webhookUrl" id="webhook" placeholder="Discord webhook URL (optional; blank = monitor only unless a default is set)" autocomplete="off">
      <button type="submit">Add</button>
      <span id="msg"></span>
    </form>
  </div>
</dialog>

<div id="overlay" hidden>
  <div id="card" class="card" role="dialog" aria-modal="true" aria-labelledby="ov-name">
    <button id="ov-close" class="close" aria-label="Close">×</button>
    <h2 id="ov-name"></h2>
    <div id="ov-count"><span id="ov-players">—</span><span id="ov-max"></span></div>
    <div id="ov-delta" class="delta"></div>
    <dl id="ov-info"></dl>
    <div class="foot"><span id="ov-status" class="muted"></span><span class="foot-btns"><button id="ov-awake">Keep awake: on</button><button id="ov-mute">Sound: on</button></span></div>
  </div>
</div>

<script>
const rows = document.getElementById("rows");
const msg = document.getElementById("msg");
let openId = null;
let lastPlayers = null;
let muted = false;
let audioCtx = null;
const seenChecks = new Map();

function cell(tr, text, cls) {
  const td = tr.insertCell();
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
}

// Compact elapsed time since an ISO timestamp: 45s, 12m, 3h 5m, 2d 4h.
function span(iso) {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60}m` : `${Math.floor(h / 24)}d ${h % 24}h`;
}
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// Reachability text for a server, or null when there is nothing to report. offlineAfter comes from the server.
let offlineAfter = 3;
function statusText(s) {
  if (s.state === "offline") {
    const how = `${span(s.offlineSince)} (since ${clock(s.offlineSince)}): ${s.error}`;
    return s.likelyRestart ? `Possibly restarting, no answer for ${how}` : `Offline for ${how}`;
  }
  if (s.failures) return `Query failing (${s.failures}/${offlineAfter}): ${s.error}`;
  return s.error ?? null;
}


function statusPill(s, defaultWebhook) {
  const notifies = s.hasWebhook || defaultWebhook;
  const detail = (statusText(s) ?? (s.state === "unknown" ? "Waiting for first response." : `ok, ${ago(s.checkedAt)}`)) + (notifies ? "" : " · no webhook, not notifying");
  let label = "Online";
  let tone = "online";
  if (s.state === "offline") {
    label = s.likelyRestart ? "Restarting" : "Offline";
    tone = s.likelyRestart ? "restarting" : "offline";
  } else if (s.failures || s.state === "unknown") {
    label = "Checking";
    tone = "checking";
  } else if (s.error) {
    label = "Alert error";
    tone = "warning";
  }
  const polled = tone === "online" && s.checkedAt && seenChecks.has(s.id) && seenChecks.get(s.id) !== s.checkedAt;
  if (s.checkedAt) seenChecks.set(s.id, s.checkedAt);
  const pill = document.createElement("button");
  pill.type = "button";
  pill.className = `status-pill ${tone}${polled ? " polled" : ""}`;
  pill.textContent = label;
  pill.dataset.detail = detail;
  pill.setAttribute("aria-label", `${label}: ${detail}`);
  pill.setAttribute("aria-expanded", "false");
  pill.onclick = (ev) => {
    ev.stopPropagation();
    const expanded = pill.classList.toggle("expanded");
    pill.setAttribute("aria-expanded", String(expanded));
  };
  return pill;
}

// fetch wrapper: JSON in/out, and a lost session (401) sends the user to the login page.
async function api(path, { method = "GET", body } = {}) {
  const r = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    location.replace("/login");
    throw new Error("signed out");
  }
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
}

// "30s", "90s", "5m", "1h 30m" for a whole number of seconds.
function secs(n) {
  if (n < 120) return `${n}s`;
  const m = Math.round(n / 60);
  return m < 120 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ""}`;
}

// The status bar above the list: what the watcher is doing and how it is configured.
const monbar = document.getElementById("monbar");
function renderMonitor(data) {
  const list = data.servers;
  const n = (pred) => list.filter(pred).length;
  const offline = n((s) => s.state === "offline" && !s.likelyRestart);
  const restarting = n((s) => s.state === "offline" && s.likelyRestart);
  const checking = n((s) => s.state !== "offline" && (s.failures || s.state === "unknown"));
  const online = list.length - offline - restarting - checking;
  const fast = list.some((s) => s.failures > 0 && (s.state !== "offline" || s.likelyRestart)); // quick rechecks are running
  const alerting = n((s) => s.hasWebhook || data.defaultWebhook);
  const lastCheck = list.reduce((a, s) => (s.checkedAt && (!a || s.checkedAt > a) ? s.checkedAt : a), null);

  const parts = [];
  const add = (count, text, cls) => count && parts.push([`${count} ${text}`, cls]);
  add(online, "online", "ok");
  add(checking, "checking", "warn");
  add(restarting, "restarting?", "warn");
  add(offline, "offline", "err");

  const items = [];
  const head = document.createElement("span");
  head.className = "head";
  if (!list.length) {
    head.textContent = "Monitoring idle";
    items.push(head, "Add a server to start polling");
  } else {
    head.textContent = `Monitoring ${list.length} server${list.length === 1 ? "" : "s"}`;
    const counts = document.createElement("span");
    parts.forEach(([text, cls], i) => {
      const part = document.createElement("span");
      part.className = cls;
      part.textContent = text;
      counts.append(i ? " · " : "", part);
    });
    items.push(head, counts);
    items.push(`Polling every ${secs(data.pollSeconds)}${fast ? `, rechecking every ${secs(data.recheckSeconds)}` : ""}`);
    items.push(`Last check ${lastCheck ? ago(lastCheck) : "pending"}`);
    items.push(`Offline after ${data.offlineAfter} failed polls`);
    if (data.rebootWindowMinutes > 0) items.push(`Restart window ${secs(data.rebootWindowMinutes * 60)}`);
    const alertText = document.createElement("span");
    alertText.textContent = alerting === list.length ? "Discord alerts on" : alerting ? `Discord alerts on for ${alerting}/${list.length}` : "Discord alerts off";
    if (alerting < list.length) alertText.className = "warn";
    items.push(alertText);
  }
  monbar.dataset.tone = !list.length ? "" : offline ? "err" : restarting || checking ? "warn" : "ok";
  monbar.replaceChildren(...items.map((it) => (typeof it === "string" ? Object.assign(document.createElement("span"), { textContent: it }) : it)));
}

async function load() {
  const { data } = await api("/api/servers");
  offlineAfter = data.offlineAfter ?? offlineAfter;
  renderMonitor(data);
  const currentIds = new Set(data.servers.map((s) => s.id));
  for (const id of seenChecks.keys()) if (!currentIds.has(id)) seenChecks.delete(id);
  rows.replaceChildren();
  if (!data.servers.length) {
    const tr = rows.insertRow();
    const td = cell(tr, "No servers yet.", "muted");
    td.colSpan = 6;
  }
  for (const s of data.servers) {
    const tr = rows.insertRow();
    tr.className = "clickable";
    tr.onclick = () => openOverlay(s);
    cell(tr, s.info?.name ?? "—");
    cell(tr, `${s.host}:${s.queryPort}`);
    cell(tr, s.info?.map ?? "—");
    const dark = s.state === "offline";
    cell(tr, dark ? (s.likelyRestart ? "restarting?" : "offline") : s.info ? `${s.info.players}/${s.info.maxPlayers}` : "—", dark ? (s.likelyRestart ? "warn" : "err") : "");
    const status = tr.insertCell();
    status.append(statusPill(s, data.defaultWebhook));
    const td = tr.insertCell();
    const btn = document.createElement("button");
    btn.textContent = "Remove";
    btn.onclick = async (ev) => {
      ev.stopPropagation(); // don't open the overlay
      if (!(await ask({ title: "Remove server", text: `Remove ${s.host}:${s.queryPort}? Its history is deleted too.`, confirmLabel: "Remove" }))) return;
      await api(`/api/servers/${s.id}`, { method: "DELETE" });
      load();
    };
    const stats = document.createElement("a");
    stats.className = "btn";
    stats.textContent = "Stats";
    stats.href = `/servers/${encodeURIComponent(s.id)}`;
    stats.onclick = (ev) => ev.stopPropagation(); // don't open the overlay
    const actions = document.createElement("div");
    actions.className = "row-actions";
    actions.append(stats, btn);
    td.append(actions);
  }
  refreshOverlay(data.servers);
}

// ---- Server detail overlay ----
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const ovCount = document.getElementById("ov-count");

// ---- Per-map themes, each with a day and a night variant ----
// Keyed by the A2S map name (lower-cased, letters only). Day/night follows the server's in-game clock.
// Art is inline SVG layered on the card: a sun/moon/cloud accent, stars at night, and a landscape along the bottom.
const svgUrl = (vb, body, aspect = "none") =>
  `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}' preserveAspectRatio='${aspect}'>${body}</svg>`)}")`;
const ridge = (d, fill, op) => `<path d='${d} L600 200 L0 200Z' fill='${fill}' opacity='${op}'/>`;
const pines = (fill, op, base, h) =>

const MAP_THEME = {
  nasdara: "desert", takistan: "desert", takistanplus: "desert",
  enoch: "forest", livonia: "forest",
  chernarus: "temperate", chernarusplus: "temperate",
  namalsk: "arctic",
  sakhal: "sakhal",
  deerisle: "coast",
  esseker: "harvest",
};

function themeKey(map) {
  const m = (map ?? "").toLowerCase().replace(/[^a-z]/g, "");
  return MAP_THEME[m] ?? (m.startsWith("chernarus") ? "temperate" : "default");
}

// In-game clock "HH:MM" -> day from 06:00 to 17:59, otherwise night. No clock reported: assume day.
function phaseOf(gameTime) {
  const h = Number(/^(\d{2}):/.exec(gameTime ?? "")?.[1]);
  return Number.isNaN(h) || (h >= 6 && h < 18) ? "day" : "night";
}

function applyTheme(map, gameTime) {
  const key = themeKey(map);
  const phase = phaseOf(gameTime);
  const id = `${key}-${phase}`;
  if (card.dataset.theme === id) return;
  const t = THEMES[key][phase];
  card.dataset.theme = id;
  const set = (k, v) => overlay.style.setProperty(k, v);
  const stack = (pick) => [...t.layers.map(pick), t.sky].join(", ");
  set("--art", stack((l) => `${l[0]} ${l[1]}`));
  set("--art-sm", stack((l) => `${l[0]} ${l[2] ?? l[1]}`)); // phones: smaller sun/moon so it doesn't sit behind the count
  set("--border", t.border);
  set("--text", t.text);
  set("--muted", t.muted);
  set("--accent", t.accent);
  set("--backdrop", t.backdrop);
  set("--btn-bg", t.btnBg);
  set("--ok", t.ok);
  set("--err", t.err);
}

// Keeps the phone's screen on while the overlay is open. Needs a secure context (HTTPS or localhost) and a browser with
// the Screen Wake Lock API (iOS/iPadOS 16.4+, Chrome on Android); elsewhere `navigator.wakeLock` is missing and this
// does nothing. The browser drops the lock whenever the tab is hidden, so visibilitychange re-requests it.
let wakeLock = null;
let keepAwake = true; // the overlay's "Keep awake" toggle
async function holdScreenOn() {
  if (!openId || !keepAwake || wakeLock || !navigator.wakeLock || document.visibilityState !== "visible") return;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (!openId || !keepAwake || wakeLock) return void lock.release(); // closed, switched off or raced while the request was pending
    wakeLock = lock;
    lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
  } catch {
    // Denied (battery saver, no user activation, ...): the screen just follows the OS timeout.
  }
}
function releaseScreen() {
  wakeLock?.release().catch(() => {});
  wakeLock = null;
}
document.addEventListener("visibilitychange", holdScreenOn);

function openOverlay(s) {
  // Created inside the click handler so the browser allows audio playback later.
  audioCtx ??= new AudioContext();
  audioCtx.resume();
  openId = s.id;
  lastPlayers = s.state === "offline" ? null : (s.info?.players ?? null);
  document.getElementById("ov-delta").textContent = "";
  applyTheme(s.info?.map, s.info?.gameTime);
  card.classList.remove("flash-up", "flash-down");
  overlay.hidden = false;
  document.documentElement.classList.add("modal-open");
  renderOverlay(s);
  holdScreenOn();
}

function closeOverlay() {
  openId = null;
  overlay.hidden = true;
  document.documentElement.classList.remove("modal-open");
  releaseScreen();
}

function renderOverlay(s) {
  const i = s.info;
  if (i) applyTheme(i.map, i.gameTime);
  document.getElementById("ov-name").textContent = i?.name ?? `${s.host}:${s.queryPort}`;
  const offline = s.state === "offline";
  card.classList.toggle("offline", offline);
  card.classList.toggle("restarting", offline && s.likelyRestart);
  document.getElementById("ov-players").textContent = offline ? (s.likelyRestart ? "restarting?" : "offline") : i ? i.players : "—";
  document.getElementById("ov-max").textContent = offline ? "" : i ? `/ ${i.maxPlayers}` : "";
  const delta = document.getElementById("ov-delta");
  if (offline) {
    delta.textContent = i ? `Last seen with ${i.players}/${i.maxPlayers} players` : "";
    delta.className = "delta muted";
    delta.dataset.offline = "1";
  } else if (delta.dataset.offline) {
    delta.textContent = "";
    delta.className = "delta";
    delete delta.dataset.offline;
  }
  const yn = (v) => (v ? "Yes" : "No");
  const facts = [
    ["Address", `${s.host}:${s.queryPort}`],
    ["Game port", i?.gamePort ?? "—"],
    ["Map", i?.map ?? "—"],
    ["Version", i?.version ?? "—"],
    ["Platform", i?.platform ?? "—"],
    ["In-game time", i?.gameTime ?? "—"],
    ["BattlEye", i ? yn(i.battleye) : "—"],
    ["Third person", i ? yn(i.thirdPerson) : "—"],
    ["Password", i ? yn(i.passwordProtected) : "—"],
  ];
  const dl = document.getElementById("ov-info");
  dl.replaceChildren();
  for (const [k, v] of facts) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    dl.append(dt, dd);
  }
  const st = document.getElementById("ov-status");
  st.textContent = statusText(s) ?? `Last checked ${ago(s.checkedAt)}`;
  st.className = offline && s.likelyRestart ? "muted" : s.error ? "err" : "muted"; // a restart isn't an error, so not red
}

function refreshOverlay(servers) {
  if (!openId) return;
  const s = servers.find((x) => x.id === openId);
  if (!s) return closeOverlay(); // removed elsewhere
  renderOverlay(s);
  if (s.state === "offline") {
    lastPlayers = null; // coming back is a fresh baseline, like the Discord alert
    return;
  }
  if (!s.info) return;
  if (lastPlayers !== null && s.info.players !== lastPlayers) alertChange(s.info.players - lastPlayers);
  lastPlayers = s.info.players;
}

function alertChange(delta) {
  const up = delta > 0;
  const n = Math.abs(delta);
  const el = document.getElementById("ov-delta");
  el.textContent = `${up ? "+" : "−"}${n} ${up ? "joined" : "left"} at ${new Date().toLocaleTimeString()}`;
  el.className = `delta ${up ? "ok" : "err"}`;
  // Restart the CSS animations even if a previous flash is still running.
  card.classList.remove("flash-up", "flash-down");
  ovCount.classList.remove("pop");
  void card.offsetWidth;
  card.classList.add(up ? "flash-up" : "flash-down");
  ovCount.classList.add("pop");
  beep(up);
}

function beep(up) {
  if (muted || !audioCtx) return;
  // Rising two-tone for a join, falling for a leave; three repeats so it's hard to miss.
  const [a, b] = up ? [660, 990] : [880, 440];
  const t0 = audioCtx.currentTime;
  for (let k = 0; k < 3; k++) {
    [a, b].forEach((freq, j) => {
      const t = t0 + k * 0.5 + j * 0.2;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    });
  }
}

// ---- Server directory autocomplete ----
// Typing in the search box queries /api/directory; picking a result fills host + query port.
const dirQ = document.getElementById("dir-q");
const dirList = document.getElementById("dir-list");
const addForm = document.getElementById("add");
let dirItems = [];
let dirActive = -1;
let dirSeq = 0;
let dirTimer;

function dirClose() {
  dirList.hidden = true;
  dirQ.setAttribute("aria-expanded", "false");
  dirActive = -1;
}

function dirHighlight(i) {
  dirActive = i;
  [...dirList.children].forEach((li, n) => li.setAttribute("aria-selected", String(n === i)));
  dirList.children[i]?.scrollIntoView({ block: "nearest" });
}

function dirNote(text) {
  const li = document.createElement("li");
  li.className = "note";
  li.textContent = text;
  dirItems = []; // the note isn't selectable; drop stale results so arrows/Enter can't pick them
  dirList.replaceChildren(li);
  dirList.hidden = false;
}

function dirPick(s) {
  addForm.host.value = s.host;
  addForm.queryPort.value = s.queryPort;
  dirQ.value = s.name;
  dirClose();
  addForm.webhookUrl.focus();
}

function dirRender(servers) {
  dirItems = servers;
  dirList.replaceChildren(
    ...servers.map((s) => {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      const dn = document.createElement("div");
      dn.className = "dn";
      dn.textContent = s.name;
      const dm = document.createElement("div");
      dm.className = "dm";
      dm.textContent = [`${s.host}:${s.queryPort}`, s.map, `${s.players}/${s.maxPlayers}`, s.password ? "password" : null].filter(Boolean).join(" · ");
      li.append(dn, dm);
      li.addEventListener("mousedown", (ev) => {
        ev.preventDefault(); // keep focus in the input so blur doesn't close the list first
        dirPick(s);
      });
      return li;
    }),
  );
  dirList.hidden = false;
  dirQ.setAttribute("aria-expanded", "true");
  dirHighlight(-1);
}

async function dirSearch() {
  const q = dirQ.value.trim();
  const seq = ++dirSeq;
  if (q.length < 2) return dirClose();
  let res;
  try {
    res = await api(`/api/directory?q=${encodeURIComponent(q)}&limit=10`);
  } catch {
    return;
  }
  if (seq !== dirSeq) return; // a newer keystroke superseded this response
  if (!res.ok) return dirNote(res.data.error ?? "Server search failed. Enter host and port manually.");
  if (!res.data.servers.length) return dirNote("No matching public servers. Enter host and port manually.");
  dirRender(res.data.servers);
}

dirQ.addEventListener("input", () => {
  clearTimeout(dirTimer);
  dirTimer = setTimeout(dirSearch, 200);
});
dirQ.addEventListener("keydown", (e) => {
  if (dirList.hidden) return;
  if (e.key === "Escape") {
    e.preventDefault(); // type=search would otherwise clear the typed text
    return dirClose();
  }
  if (!dirItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const n = dirItems.length;
    dirHighlight(e.key === "ArrowDown" ? (dirActive + 1) % n : (dirActive - 1 + n) % n);
  } else if (e.key === "Enter" && dirActive >= 0) {
    e.preventDefault(); // pick the result instead of submitting the form
    dirPick(dirItems[dirActive]);
  }
});
dirQ.addEventListener("focus", () => dirQ.value.trim().length >= 2 && dirItems.length && (dirList.hidden = false));
document.addEventListener("click", (e) => e.target.closest(".combo") || dirClose());

// Modal replacement for confirm() and prompt(). Resolves true/false, or with { input } the typed text / null.
function ask({ title, text = "", confirmLabel = "OK", input = null }) {
  return new Promise((resolve) => {
    const d = document.createElement("dialog");
    d.className = "ask";
    const form = document.createElement("form");
    const h2 = document.createElement("h2");
    h2.textContent = title;
    const p = document.createElement("p");
    p.textContent = text;
    form.append(h2, p);
    let field = null;
    if (input) {
      field = Object.assign(document.createElement("input"), { required: true, ...input });
      form.append(field);
    }
    const cancel = Object.assign(document.createElement("button"), { type: "button", textContent: "Cancel" });
    const ok = Object.assign(document.createElement("button"), { type: "submit", textContent: confirmLabel });
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(cancel, ok);
    form.append(actions);
    d.append(form);
    let result = input ? null : false;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      result = field ? field.value : true;
      d.close();
    });
    cancel.onclick = () => d.close();
    d.addEventListener("click", (e) => {
      if (e.target === d) d.close(); // a click on the backdrop
    });
    d.addEventListener("close", () => {
      d.remove();
      resolve(result); // Escape, Cancel and the backdrop all leave the default (no)
    });
    document.body.append(d);
    d.showModal();
    (field ?? cancel).focus(); // a confirmation defaults to Cancel, so a stray Enter can't delete
  });
}

// ---- Session, account and user management ----
const $ = (id) => document.getElementById(id);
let me = null;

$("logout").onclick = async () => {
  await api("/api/logout", { method: "POST" });
  location.replace("/login");
};

(async () => {
  me = (await api("/api/me")).data;
  $("who").textContent = me.authDisabled ? "auth disabled" : `${me.username} (${me.role})`;
  $("acct-btn").hidden = me.authDisabled;
  $("logout").hidden = me.authDisabled;
  $("admin-link").hidden = me.role !== "admin";
  load();
  setInterval(load, 1000);
})();
