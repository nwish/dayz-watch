<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dayz-watch – sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Centre the card; theme.css provides the standard page column that this replaces. */
  body { min-height: 100vh; max-width: none; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; }
  .app-footer { position: fixed; left: 0; right: 0; bottom: 1rem; margin: 0; padding: 0; border: 0; }
  main { width: min(360px, 90vw); background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--blood); border-radius: 3px; padding: 2rem; box-shadow: 0 12px 40px #000a; }
  .logo { display: block; width: 3.6rem; height: 3.6rem; margin: 0 auto .8rem; }
  h1 { letter-spacing: .12em; text-align: center; margin: 0 0 1.6rem; display: block; }
  label { display: block; color: var(--dim); margin: 0 0 .3rem; }
  input, button { padding: .6rem .7rem; width: 100%; box-sizing: border-box; }
  input { margin-bottom: 1rem; }
  button[type=submit] { letter-spacing: .06em; }
  button:disabled { opacity: .6; }
  #err { color: var(--err); min-height: 1.3em; margin-top: .8rem; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/favicon.svg" alt="">
  <h1>dayz-watch</h1>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
</main>
<script>
const f = document.getElementById("f");
const err = document.getElementById("err");
const go = document.getElementById("go");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  go.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ username: f.username.value, password: f.password.value }),
    });
    if (r.ok) {
      location.replace("/");
      return;
    }
    const data = await r.json().catch(() => ({}));
    err.textContent = data.error ?? `Sign-in failed (${r.status})`;
    f.password.value = "";
    f.password.focus();
  } catch {
    err.textContent = "Could not reach the server.";
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
