name: Publish image

# Manual for now: Actions tab -> "Publish image" -> Run workflow.
# Runs the tests, then builds the Dockerfile and pushes it to GitHub Container Registry
# as ghcr.io/<owner>/<repo>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extra version tag to push, e.g. 1.2.0 (optional). sha-<commit> is always pushed, and latest too when run from the default branch."
        required: false
        type: string
      platforms:
        description: "Platforms to build"
        required: false
        default: linux/amd64,linux/arm64
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # for the arm64 build
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            while IFS= read -r tag; do echo "- ${tag}"; done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
