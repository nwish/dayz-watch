name: Publish image

# Pushing a version tag (v1.2.3) runs the tests, builds the Dockerfile and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/<repo> tagged 1.2.3, 1.2, sha-<commit> and latest (a pre-release such as
# v1.2.3-rc1 gets its own version and sha tags but never moves latest). Create the tag from the release page.
# Running it by hand (Actions tab -> "Publish image" -> Run workflow) only pushes sha-<commit>,
# so a test build can't change what latest or a version tag points at.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: false
        default: linux/amd64,linux/arm64,linux/arm/v7
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry names must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # for the arm64 and arm/v7 builds
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }} # a tag push has no inputs
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            while IFS= read -r tag; do echo "- ${tag}"; done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
